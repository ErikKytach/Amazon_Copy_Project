{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md mx-auto mt-10">
    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Create an Account</h2>
    <form action="/registration/" method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
        {{ form.first_name }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
        {{ form.last_name }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">E-Mail</label>
        {{ form.email }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
        {{ form.phonenumber }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        {{ form.password1 }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        {{ form.password2 }}
      </div>
      <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md font-medium transition">
        Sign Up
      </button>
    </form>
  </div>
{% endblock %}
