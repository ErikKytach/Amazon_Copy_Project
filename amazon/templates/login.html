{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md mx-auto mt-10">
    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Log In to Your Account</h2>
    <form action="/login/" method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md font-medium transition">
        Log In
      </button>
    </form>
  </div>
{% endblock %}
