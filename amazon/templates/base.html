<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Amazon{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Horizontal Navbar -->
    <nav class="bg-white shadow flex items-center px-8 py-3 sticky top-0 z-30">
        <div class="text-blue-600 font-bold text-2xl mr-8">
            <a href="/all_products/">Amazon</a>
        </div>
        <div class="flex items-center space-x-2">
            <a href="/all_products" class="px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium">All Products</a>
            <div class="relative group">
                <button class="flex items-center px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium focus:outline-none">
                    Add <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div class="absolute left-0 mt-2 w-48 bg-white border rounded shadow-lg opacity-0 group-hover:opacity-100 group-hover:pointer-events-auto pointer-events-none transition-opacity z-20">
                    <a href="/add_product" class="block px-4 py-2 hover:bg-blue-50">Add Product</a>
                    <a href="/add_category" class="block px-4 py-2 hover:bg-blue-50">Add Category</a>
                    <a href="/add_manufacturer" class="block px-4 py-2 hover:bg-blue-50">Add Manufacturer</a>
                </div>
            </div>
            <a href="/info_cart" class="px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium">Cart</a>
            <a href="/all_orders" class="px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium">My Orders</a>
        </div>
        <div class="ml-auto flex items-center space-x-2">
            {% if not user.is_authenticated %}
                <a href="/registration" class="px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium">Sign Up</a>
                <a href="/login" class="bg-yellow-400 hover:bg-yellow-500 text-sm font-medium px-4 py-2 rounded text-center">Log In</a>
            {% else %}
                <span class="px-4 py-2 text-sm text-gray-600">Welcome, {{ user.username }}</span>
                <a href="/logout" class="px-4 py-2 text-blue-600 hover:underline">Log Out</a>
            {% endif %}
        </div>
    </nav>
    <main class="flex-1 px-4 py-8 min-h-0">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-white p-4 text-center text-sm text-gray-500 border-t w-full mt-auto sticky bottom-0 z-20">
        © 2025 Amazon Clone. All rights reserved.
    </footer>
</body>
</html>
