{% extends "base.html" %}
{% block title %}Add Manufacturer{% endblock %}
{% block content %}
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-lg mx-auto mt-6">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Add Manufacturer</h1>
    <form action="/add_manufacturer/" method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input type="text" name="name" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
        <input type="text" name="country" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Business Stream</label>
        <input type="text" name="buisness_stream" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <input type="text" name="description" class="w-full border rounded px-3 py-2" />
      </div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-md font-medium transition">Add Manufacturer</button>
    </form>
  </div>
{% endblock %}
