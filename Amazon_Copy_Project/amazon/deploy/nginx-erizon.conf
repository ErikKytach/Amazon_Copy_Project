# Standalone virtual host for the second application. It deliberately uses
# port 8001, leaving the existing site's HTTP/HTTPS configuration untouched.
server {
    listen 8001;
    listen [::]:8001;
    server_name 89.168.60.56;

    client_max_body_size 10m;

    location /images/ {
        alias /srv/erizon/app/templates/images/;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /srv/erizon/app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
