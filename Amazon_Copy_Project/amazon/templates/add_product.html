{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Add Product" %} - Erizon{% endblock %}

{% block content %}
<!-- Стили для скрытия стрелочек (spinners) в полях ввода чисел -->
<style>
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
  }
</style>

<div class="max-w-4xl mx-auto px-4 py-8">

  <!-- Заголовок страницы -->
  <div class="mb-6">
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">{% trans "Add New Product" %}</h1>
    <p class="text-sm text-gray-500 mt-1">{% trans "Manage items you are selling on the marketplace" %}</p>
  </div>

  <!-- Карточка формы -->
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 sm:p-8">
    <form action="{% url 'add_product' %}" method="post" class="space-y-6">
      {% csrf_token %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Название (во всю ширину) -->
        <div class="md:col-span-2">
          <label for="title" class="block text-sm font-bold text-slate-800 mb-2">{% trans "Title" %}</label>
          <input type="text" name="title" id="title" required
            class="w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none" />
        </div>

        <!-- Цена (половина ширины) -->
        <div>
          <label for="price" class="block text-sm font-bold text-slate-800 mb-2">{% trans "Price (€)" %}</label>
          <div class="relative">
            <input type="number" step="0.01" min="0" name="price" id="price" required
              class="number-field w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none" />
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold">€</span>
          </div>
        </div>

        <!-- Количество (половина ширины) -->
        <div>
          <label for="count" class="block text-sm font-bold text-slate-800 mb-2">{% trans "Count" %}</label>
          <input type="number" step="1" min="0" name="count" id="count" required
            class="number-field w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none" />
        </div>

        <!-- Категория (половина ширины) -->
        <div>
          <label for="category_id" class="block text-sm font-bold text-slate-800 mb-2">{% trans "Category" %}</label>
          <select name="category_id" id="category_id" required
            class="w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none cursor-pointer">
            <option value="" disabled selected>{% trans "Choose Category" %}</option>
            {% for i in categories %}
              <option value="{{ i.id }}">{{ i.translated_name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Производитель (половина ширины) -->
        <div>
          <label for="manufacturer_id" class="block text-sm font-bold text-slate-800 mb-2">{% trans "Manufacturer" %}</label>
          <select name="manufacturer_id" id="manufacturer_id" required
            class="w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none cursor-pointer">
            <option value="" disabled selected>{% trans "Choose Manufacturer" %}</option>
            {% for i in manufacturers %}
              <option value="{{ i.id }}">{{ i.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Статус (сделано во всю ширину для симметрии) -->
        <div class="md:col-span-2">
          <label for="status" class="block text-sm font-bold text-slate-800 mb-2">{% trans "Status" %}</label>
          <select name="status" id="status" required
            class="w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none cursor-pointer">
            <option value="New">{% trans "New" %}</option>
            <option value="Used">{% trans "Used" %}</option>
            <option value="Refurbished">{% trans "Refurbished" %}</option>
            <option value="Defective">{% trans "Defective" %}</option>
          </select>
        </div>

        <!-- Ссылка на главное изображение (во всю ширину) -->
        <div class="md:col-span-2">
          <label for="product_image" class="block text-sm font-bold text-slate-800 mb-2">{% trans "Main image URL" %}</label>
          <input type="url" name="product_image" id="product_image" required
            class="w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none"
            placeholder="https://..." />
        </div>

        <!-- Галерея (во всю ширину) -->
        <div class="md:col-span-2">
          <label for="gallery_urls" class="block text-sm font-bold text-slate-800 mb-2">
            {% trans "Additional images (max. 9, one per line)" %}
          </label>
          <textarea name="gallery_urls" id="gallery_urls" rows="3"
            class="w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none resize-y"
            placeholder="https://...&#10;https://..."></textarea>
        </div>

        <!-- Описание (во всю ширину) -->
        <div class="md:col-span-2">
          <label for="description" class="block text-sm font-bold text-slate-800 mb-2">{% trans "Description" %}</label>
          <textarea name="description" id="description" rows="5" required
            class="w-full bg-white border border-gray-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 block p-3 transition-colors outline-none resize-y"
            placeholder="{% trans 'Detailed description of the product...' %}"></textarea>
        </div>

      </div>

      <!-- Кнопка отправки -->
      <div class="pt-6 flex justify-end">
        <button type="submit"
          class="group relative inline-flex items-center justify-center gap-2 bg-gray-900 hover:bg-orange-500 text-white font-bold py-3 px-8 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2">
          <svg class="w-5 h-5 transition-transform duration-300 group-hover:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          <span>{% trans "Add Product" %}</span>
        </button>
      </div>

    </form>
  </div>
</div>

<!-- Скрипт защиты от нечисловых знаков -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const numberInputs = document.querySelectorAll('.number-field');

    numberInputs.forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (['e', 'E', '+', '-'].includes(e.key)) {
          e.preventDefault();
        }
      });
      input.addEventListener('paste', (e) => {
        const pasteData = (e.clipboardData || window.clipboardData).getData('text');
        if (/[eE\+\-]/.test(pasteData)) {
          e.preventDefault();
        }
      });
    });
  });
</script>
{% endblock %}
