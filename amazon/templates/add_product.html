{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-lg mx-auto mt-6">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Add New Product</h1>
    <form action="/add_product/" method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input type="text" name="title" id="title" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Price (€)</label>
        <input type="number" step="0.01" name="price" id="price" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label for="product_image" class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
        <input type="text" name="product_image" id="product_image" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <input type="text" name="description" id="description" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label for="count" class="block text-sm font-medium text-gray-700 mb-1">Count</label>
        <input type="number" name="count" id="count" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <input type="text" name="status" id="status" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label for="isavaible" class="block text-sm font-medium text-gray-700 mb-1">Available? (yes/no)</label>
        <input type="text" name="isavaible" id="isavaible" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label for="manufacturer_id" class="block text-sm font-medium text-gray-700 mb-1">Manufacturer</label>
        <select name="manufacturer_id" id="manufacturer_id" class="w-full border rounded px-3 py-2">
          {% for i in manufacturers %}
            <option value="{{ i.id }}">{{ i.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="category_id" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select name="category_id" id="category_id" class="w-full border rounded px-3 py-2">
          {% for i in categories %}
            <option value="{{ i.id }}">{{ i.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-md font-medium transition">Add Product</button>
    </form>
  </div>
{% endblock %}
